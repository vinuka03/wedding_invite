<svg xmlns="http://www.w3.org/2000/svg" width="500" height="660" viewBox="0 0 500 660" fill="none">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="100%" stop-color="#f9f0da"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#f4d06f"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8c44e"/>
      <stop offset="100%" stop-color="#c9a227"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.45" r="0.4">
      <stop offset="0%" stop-color="#f9e4a0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f9e4a0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bodyShadow" x="-15%" y="-8%" width="130%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8b6914" flood-opacity="0.2"/>
    </filter>
    <filter id="innerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#b8860b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Card body -->
  <g filter="url(#bodyShadow)">
    <rect x="20" y="20" width="460" height="620" rx="20" fill="url(#parchment)"/>
  </g>

  <!-- Outer gold border -->
  <rect x="20" y="20" width="460" height="620" rx="20" fill="none" stroke="url(#goldRim)" stroke-width="3"/>
  <!-- Inner gold border -->
  <rect x="33" y="33" width="434" height="594" rx="14" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.55"/>
  <!-- Third inner border -->
  <rect x="42" y="42" width="416" height="578" rx="10" fill="none" stroke="#d4a017" stroke-width="0.5" opacity="0.35"/>

  <!-- Center glow -->
  <ellipse cx="250" cy="290" rx="160" ry="180" fill="url(#centerGlow)"/>

  <!-- Top decorative arch (Sri Lankan temple-inspired) -->
  <g opacity="0.7">
    <path d="M130 120 Q250 50 370 120" stroke="url(#goldRim)" stroke-width="2.5" fill="none"/>
    <path d="M140 130 Q250 68 360 130" stroke="#c9a227" stroke-width="0.8" fill="none" opacity="0.5"/>
    <!-- Small stupas/domes -->
    <circle cx="250" cy="62" r="8" fill="none" stroke="url(#goldRim)" stroke-width="2"/>
    <circle cx="250" cy="62" r="4" fill="#e8c44e" opacity="0.6"/>
    <path d="M250 50 L250 46" stroke="#c9a227" stroke-width="1.5"/>
    <!-- Side ornaments -->
    <path d="M180 100 Q175 90 185 85 Q195 90 190 100" stroke="url(#goldRim)" stroke-width="1.5" fill="none"/>
    <path d="M320 100 Q325 90 315 85 Q305 90 310 100" stroke="url(#goldRim)" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Central Lotus / Mandalala-style flower -->
  <g transform="translate(250, 310)">
    <!-- Outer petals -->
    <g opacity="0.6" stroke="url(#goldRim)" stroke-width="2" fill="none">
      <ellipse cx="0" cy="-70" rx="22" ry="50"/>
      <ellipse cx="0" cy="70" rx="22" ry="50"/>
      <ellipse cx="-70" cy="0" rx="50" ry="22"/>
      <ellipse cx="70" cy="0" rx="50" ry="22"/>
      <ellipse cx="-49" cy="-49" rx="20" ry="42" transform="rotate(-45)"/>
      <ellipse cx="49" cy="-49" rx="20" ry="42" transform="rotate(45)"/>
      <ellipse cx="-49" cy="49" rx="20" ry="42" transform="rotate(45)"/>
      <ellipse cx="49" cy="49" rx="20" ry="42" transform="rotate(-45)"/>
    </g>
    <!-- Inner petals -->
    <g opacity="0.8" stroke="#c9a227" stroke-width="1.5" fill="none">
      <ellipse cx="0" cy="-42" rx="14" ry="30"/>
      <ellipse cx="0" cy="42" rx="14" ry="30"/>
      <ellipse cx="-42" cy="0" rx="30" ry="14"/>
      <ellipse cx="42" cy="0" rx="30" ry="14"/>
    </g>
    <!-- Center circle -->
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#goldRim)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#f9e4a0" opacity="0.3"/>
    <circle cx="0" cy="0" r="6" fill="#c9a227" opacity="0.5"/>
  </g>

  <!-- Decorative corner motifs -->
  <g opacity="0.6">
    <!-- Top-left -->
    <path d="M50 50 L50 85 M50 50 L85 50" stroke="url(#goldRim)" stroke-width="2" stroke-linecap="round"/>
    <path d="M55 55 Q70 55 70 70 Q70 55 85 55" stroke="#c9a227" stroke-width="1" fill="none"/>
    <!-- Top-right -->
    <path d="M450 50 L450 85 M450 50 L415 50" stroke="url(#goldRim)" stroke-width="2" stroke-linecap="round"/>
    <path d="M445 55 Q430 55 430 70 Q430 55 415 55" stroke="#c9a227" stroke-width="1" fill="none"/>
    <!-- Bottom-left -->
    <path d="M50 610 L50 575 M50 610 L85 610" stroke="url(#goldRim)" stroke-width="2" stroke-linecap="round"/>
    <path d="M55 605 Q70 605 70 590 Q70 605 85 605" stroke="#c9a227" stroke-width="1" fill="none"/>
    <!-- Bottom-right -->
    <path d="M450 610 L450 575 M450 610 L415 610" stroke="url(#goldRim)" stroke-width="2" stroke-linecap="round"/>
    <path d="M445 605 Q430 605 430 590 Q430 605 415 605" stroke="#c9a227" stroke-width="1" fill="none"/>
  </g>

  <!-- Vertical center line (the fold / split line) -->
  <line x1="250" y1="20" x2="250" y2="640" stroke="#c9a227" stroke-width="0.5" opacity="0.2" stroke-dasharray="4 6"/>

  <!-- Bottom decorative arch -->
  <g opacity="0.7">
    <path d="M130 540 Q250 610 370 540" stroke="url(#goldRim)" stroke-width="2.5" fill="none"/>
    <path d="M140 530 Q250 592 360 530" stroke="#c9a227" stroke-width="0.8" fill="none" opacity="0.5"/>
    <circle cx="250" cy="598" r="8" fill="none" stroke="url(#goldRim)" stroke-width="2"/>
    <circle cx="250" cy="598" r="4" fill="#e8c44e" opacity="0.6"/>
    <path d="M250 610 L250 614" stroke="#c9a227" stroke-width="1.5"/>
  </g>

  <!-- Small golden dot pattern accents -->
  <g fill="#c9a227" opacity="0.3">
    <circle cx="120" cy="300" r="2"/>
    <circle cx="380" cy="300" r="2"/>
    <circle cx="100" cy="200" r="1.5"/>
    <circle cx="400" cy="200" r="1.5"/>
    <circle cx="100" cy="420" r="1.5"/>
    <circle cx="400" cy="420" r="1.5"/>
  </g>
</svg>
