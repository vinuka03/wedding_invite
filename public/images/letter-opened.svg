<svg xmlns="http://www.w3.org/2000/svg" width="500" height="660" viewBox="0 0 500 660" fill="none">
  <defs>
    <linearGradient id="parchment2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffef8"/>
      <stop offset="100%" stop-color="#f9f0da"/>
    </linearGradient>
    <linearGradient id="goldRim2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="50%" stop-color="#f4d06f"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="leftShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="centerGlow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff4c0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff4c0" stop-opacity="0"/>
    </radialGradient>
    <filter id="bodyShadow2" x="-15%" y="-8%" width="130%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#8b6914" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Inner back panel (what's revealed behind the doors) -->
  <g filter="url(#bodyShadow2)">
    <rect x="20" y="20" width="460" height="620" rx="20" fill="url(#parchment2)"/>
  </g>
  <rect x="20" y="20" width="460" height="620" rx="20" fill="none" stroke="url(#goldRim2)" stroke-width="3"/>
  <rect x="33" y="33" width="434" height="594" rx="14" fill="none" stroke="#c9a227" stroke-width="1" opacity="0.55"/>
  <rect x="42" y="42" width="416" height="578" rx="10" fill="none" stroke="#d4a017" stroke-width="0.5" opacity="0.35"/>

  <!-- Bright inner glow -->
  <ellipse cx="250" cy="330" rx="180" ry="240" fill="url(#centerGlow2)"/>

  <!-- Inner golden border ring -->
  <rect x="55" y="55" width="390" height="550" rx="10" fill="none" stroke="#d4a017" stroke-width="0.5" opacity="0.4" stroke-dasharray="2 8"/>

  <!-- Top arch -->
  <g opacity="0.8">
    <path d="M130 120 Q250 50 370 120" stroke="url(#goldRim2)" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="62" r="8" fill="none" stroke="url(#goldRim2)" stroke-width="2"/>
    <circle cx="250" cy="62" r="4" fill="#e8c44e" opacity="0.7"/>
    <path d="M250 50 L250 46" stroke="#c9a227" stroke-width="1.5"/>
  </g>

  <!-- Central Lotus (brighter in opened state) -->
  <g transform="translate(250, 330)">
    <g opacity="0.75" stroke="url(#goldRim2)" stroke-width="2.5" fill="none">
      <ellipse cx="0" cy="-70" rx="22" ry="50"/>
      <ellipse cx="0" cy="70" rx="22" ry="50"/>
      <ellipse cx="-70" cy="0" rx="50" ry="22"/>
      <ellipse cx="70" cy="0" rx="50" ry="22"/>
      <ellipse cx="-49" cy="-49" rx="20" ry="42" transform="rotate(-45)"/>
      <ellipse cx="49" cy="-49" rx="20" ry="42" transform="rotate(45)"/>
      <ellipse cx="-49" cy="49" rx="20" ry="42" transform="rotate(45)"/>
      <ellipse cx="49" cy="49" rx="20" ry="42" transform="rotate(-45)"/>
    </g>
    <g opacity="0.9" stroke="#c9a227" stroke-width="1.5" fill="none">
      <ellipse cx="0" cy="-42" rx="14" ry="30"/>
      <ellipse cx="0" cy="42" rx="14" ry="30"/>
      <ellipse cx="-42" cy="0" rx="30" ry="14"/>
      <ellipse cx="42" cy="0" rx="30" ry="14"/>
    </g>
    <circle cx="0" cy="0" r="22" fill="none" stroke="url(#goldRim2)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="#f9e4a0" opacity="0.4"/>
    <circle cx="0" cy="0" r="6" fill="#c9a227" opacity="0.6"/>
  </g>

  <!-- Bottom arch -->
  <g opacity="0.8">
    <path d="M130 540 Q250 610 370 540" stroke="url(#goldRim2)" stroke-width="2.5" fill="none"/>
    <circle cx="250" cy="598" r="8" fill="none" stroke="url(#goldRim2)" stroke-width="2"/>
    <circle cx="250" cy="598" r="4" fill="#e8c44e" opacity="0.7"/>
    <path d="M250 610 L250 614" stroke="#c9a227" stroke-width="1.5"/>
  </g>

  <!-- Corner motifs -->
  <g opacity="0.6">
    <path d="M50 50 L50 85 M50 50 L85 50" stroke="url(#goldRim2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M450 50 L450 85 M450 50 L415 50" stroke="url(#goldRim2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M50 610 L50 575 M50 610 L85 610" stroke="url(#goldRim2)" stroke-width="2" stroke-linecap="round"/>
    <path d="M450 610 L450 575 M450 610 L415 610" stroke="url(#goldRim2)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Subtle shading on left and right panels to suggest the opened doors -->
  <rect x="20" y="20" width="230" height="620" rx="20" fill="url(#leftShade)"/>
  <rect x="250" y="20" width="230" height="620" rx="20" fill="url(#rightShade)"/>

  <!-- Golden dot accents -->
  <g fill="#c9a227" opacity="0.35">
    <circle cx="120" cy="300" r="2"/>
    <circle cx="380" cy="300" r="2"/>
    <circle cx="100" cy="200" r="1.5"/>
    <circle cx="400" cy="200" r="1.5"/>
    <circle cx="100" cy="440" r="1.5"/>
    <circle cx="400" cy="440" r="1.5"/>
  </g>

  <!-- Center vertical golden seam (where it split) -->
  <line x1="250" y1="55" x2="250" y2="605" stroke="url(#goldRim2)" stroke-width="1.5" opacity="0.3"/>
</svg>
